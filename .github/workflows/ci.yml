name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate everything-bob
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Run test suite
        run: node tests/cli.test.js

      - name: Validate all components
        run: node bin/everything-bob validate

      - name: Benchmark all skills
        run: node bin/everything-bob test-all --json

  install-profiles:
    name: Test install profiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test core profile dry-run
        run: node bin/everything-bob install --profile core --dry-run

      - name: Test developer profile dry-run
        run: node bin/everything-bob install --profile developer --dry-run

      - name: Test full profile dry-run
        run: node bin/everything-bob install --profile full --dry-run

      - name: Test actual core install
        run: |
          mkdir -p /tmp/test-workspace
          node bin/everything-bob install --profile core --workspace /tmp/test-workspace
          test -f /tmp/test-workspace/rules/BOB.md
          test -d /tmp/test-workspace/skills/tdd-workflow
          test -f /tmp/test-workspace/hooks.json
          echo "Core profile install verified"

  skill-frontmatter:
    name: Validate skill frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate each skill individually
        run: |
          for skill in skills/*/; do
            skill_name=$(basename "$skill")
            node bin/everything-bob test-skill "$skill_name"
          done
